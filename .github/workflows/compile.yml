name: Build NetHunter Kernel for OnePlus 6 (LOS 22.2)

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: nethunter-lineage-22.2 # 100% 锁定 LineageOS 22.2 (Android 15) 分支

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc build-essential libncurses5-dev libssl-dev xz-utils git bison flex libelf-dev clang lld ccache zip python3

    - name: Download Toolchain (Proton-Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/toolchain

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        
        # 修正：采用一加6在高版本系统下最标准的 perf 配置文件
        make O=out vendor/sdm845-perf_defconfig
        
        # 火力全开进行交叉编译
        make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Pack Kernel (AnyKernel3)
      run: |
        # 下载AnyKernel3打包工具
        git clone https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/AnyKernel3
        
        # 复制编译出来的内核主镜像 (一加6高版本通常打包为 Image.gz 或 Image.gz-dtb)
        cp out/arch/arm64/boot/Image* $GITHUB_WORKSPACE/AnyKernel3/ || true
        
        # 修正：稳妥搜寻并复制硬件设备树 dtbo.img 补丁
        find out/ -name "dtbo.img" -exec cp {} $GITHUB_WORKSPACE/AnyKernel3/ \; || true
        
        cd $GITHUB_WORKSPACE/AnyKernel3
        
        # 针对一加6 (enchilada) 修改AnyKernel3配置
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=NetHunter Kernel for LOS 22.2/g' anykernel.sh
        
        # 打包成卡刷 zip
        zip -r9 ../NetHunter-Kernel-Enchilada-22.2.zip *

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-LOS22.2
        path: NetHunter-Kernel-Enchilada-22.2.zip
