name: Build NetHunter Kernel

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

# 必须添加以下权限，否则最后一步无法上传 releases 刷机包
permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel via GitHub Actions
    runs-on: ubuntu-22.04
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          # 内核源码地址
          kernel-url: https://github.com/V0lk3n/nethunter_kernel_oneplus_sdm845
          
          # 【重要修改】请根据你手机当前装的 ROM 填写对应的分支名
          # 例如：如果你装的是 Android 14 的 LineageOS 21，这里就填 nethunter-lineage-21.0
          kernel-branch: nethunter-lineage-21.0
          
          # 一加 6/6T 骁龙 845 的通用配置文件名
          config: sdm845_defconfig 
          
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          
          # 【重要修改】根据你的分支适配的系统版本修改，如果是新版 LineageOS 建议设为 14
          android-version: 14
          aosp-clang-version: r450784d
          
          # 自动打包并上传
          anykernel3: true
          release: true
          
          # 传递 GitHub Token 用于发布 Release
          access-token: ${{ secrets.GITHUB_TOKEN }}
