name: Build NetHunter Kernel

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel via GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Fix GCC Conflict Dependencies
        run: |
          sudo apt-get remove -y gcc-multilib g++-multilib || true
          sudo apt-get autoremove -y || true

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/V0lk3n/nethunter_kernel_oneplus_sdm845
          kernel-branch: nethunter-lineage-22.2
          config: sdm845_defconfig 
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
          
          # 【核心大招】手动注入一加 6/6T 老内核高版本适配所必须的交叉编译参数，彻底解决 Stop 报错
          extra-make-args: [
            "CLANG_TRIPLE=aarch64-linux-gnu-",
            "LD=ld.lld",
            "AR=llvm-ar",
            "NM=llvm-nm",
            "OBJCOPY=llvm-objcopy",
            "OBJDUMP=llvm-objdump",
            "STRIP=llvm-strip"
          ]
