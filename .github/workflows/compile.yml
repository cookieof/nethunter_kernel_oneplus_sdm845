name: Build NetHunter Kernel

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel via GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Fix GCC Conflict Dependencies
        run: |
          sudo apt-get remove -y gcc-multilib g++-multilib || true
          sudo apt-get autoremove -y || true

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/V0lk3n/nethunter_kernel_oneplus_sdm845
          kernel-branch: nethunter-lineage-22.2
          config: sdm845_defconfig 
          arch: arm64
          
          # 【彻底解决限制】两个同时开为 true，满足 Actions 的硬性检测条件
          aosp-gcc: true
          aosp-clang: true
          
          # 【核心闭环】改用 Android 12 的编译器环境
          # 12 既拥有全套可公开下载的 GCC 分支，又拥有完美支持 modern 变量的高版 Clang (r416183b)
          android-version: 12
          aosp-clang-version: r416183b
          
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
          
          # 配合 Android 12 Clang 的现代内核编译变量，保证编译不再报错
          extra-make-args: |
            CLANG_TRIPLE=aarch64-linux-gnu-
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
