name: Build OnePlus SDM845 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt update

        sudo apt install -y \
          git bc bison build-essential curl flex g++-multilib \
          gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
          libsdl1.2-dev libssl-dev lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev \
          gcc-aarch64-linux-gnu python3

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64

        export KBUILD_BUILD_USER=github
        export KBUILD_BUILD_HOST=actions

        export PATH=$PWD/clang/bin:$PATH

        make O=out clean

        make O=out \
          ARCH=arm64 \
          vendor/sdm845-perf_defconfig

        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu-

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          out/arch/arm64/boot/Image.gz-dtb
