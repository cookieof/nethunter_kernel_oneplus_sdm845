name: Build OnePlus6 NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          git \
          gnupg \
          gperf \
          imagemagick \
          lib32ncurses5-dev \
          lib32readline-dev \
          lib32z1-dev \
          libelf-dev \
          liblz4-tool \
          libncurses5-dev \
          libsdl1.2-dev \
          libssl-dev \
          lld \
          lz4 \
          lzop \
          pngcrush \
          rsync \
          schedtool \
          squashfs-tools \
          unzip \
          xz-utils \
          zip \
          zlib1g-dev

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang.git \
          clang

    - name: Prepare output
      run: |
        mkdir -p out

    - name: Show available defconfigs
      run: |
        find arch/arm64/configs -name "*enchilada*"
        find arch/arm64/configs -name "*sdm845*"

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64

        export KBUILD_BUILD_USER=github
        export KBUILD_BUILD_HOST=actions

        # 将 Proton Clang 的 bin 目录加入环境变量
        export PATH=$PWD/clang/bin:$PATH

        # 清理输出目录
        make O=out ARCH=arm64 clean

        # 配置 defconfig
        make O=out ARCH=arm64 enchilada_defconfig

        # 开始编译 (为了好抓错，暂时将参数调整为 -j2)
        # 引入 KCFLAGS="-w" 屏蔽所有版本不兼容带来的警告干扰
        make -j2 \
          O=out \
          ARCH=arm64 \
          KCFLAGS="-w" \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip

    - name: Verify output
      run: |
        ls -lah out/arch/arm64/boot/

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus6-Kernel
        path: |
          out/arch/arm64/boot/Image.gz-dtb

    - name: Upload dtbo
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus6-dtbo
        path: |
          out/arch/arm64/boot/dtbo.img
        if-no-files-found: ignore
